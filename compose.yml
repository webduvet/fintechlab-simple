# Works with `docker compose` and `podman compose` as far as practical.
# Secrets here are fake-and-obvious. Do not point this at a real bank.
name: fintechlab-simple

services:
  # No other service declares depends_on: ca. It is a one-shot script that
  # exits 0 once certs exist; podman-compose does not honor
  # service_completed_successfully (always requires the target still
  # running) so that edge is a race, not a guarantee, under Podman.
  # receiver/notifier instead wait for their own cert files at startup
  # (internal/waitfor) — see docs/security/ca-and-tls.md.
  ca:
    build:
      context: .
      dockerfile: docker/Dockerfile.ca
    environment:
      CERTS_DIR: /certs
    volumes:
      - ./certs:/certs
      - ./ca/generate.sh:/generate.sh:ro

  bank:
    build:
      context: .
      dockerfile: docker/Dockerfile.bank
    ports:
      - "8081:8081"
    environment:
      LISTEN: ":8081"

  notifier:
    build:
      context: .
      dockerfile: docker/Dockerfile.notifier
    ports:
      - "8082:8082"
    environment:
      LISTEN: ":8082"
      WEBHOOK_URL: https://receiver:8443/webhooks
      # Enforced in code. Hostnames on the compose network + loopback.
      WEBHOOK_ALLOWLIST: receiver,receiver:8443,localhost,127.0.0.1
      HMAC_SECRET: sim-hmac-dev-only
      CA_FILE: /certs/ca.pem
      # Short demo backoffs. A prod-shaped profile is 15s,30s,1m.
      RETRY_BACKOFF: 1s,2s,4s
      MAX_ATTEMPTS: "4"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      receiver:
        condition: service_started

  payment-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.payment-api
    ports:
      - "8080:8080"
    environment:
      LISTEN: ":8080"
      BANK_URL: http://bank:8081
      NOTIFIER_URL: http://notifier:8082
    depends_on:
      bank:
        condition: service_started
      notifier:
        condition: service_started

  receiver:
    build:
      context: .
      dockerfile: docker/Dockerfile.receiver
    ports:
      - "8443:8443"
    environment:
      LISTEN: ":8443"
      TLS_CERT: /certs/receiver.pem
      TLS_KEY: /certs/receiver-key.pem
      HMAC_SECRET: sim-hmac-dev-only
    volumes:
      - ./certs:/certs:ro

  settlement:
    build:
      context: .
      dockerfile: docker/Dockerfile.settlement
    ports:
      - "8083:8083"
    environment:
      LISTEN: ":8083"
      BANK_URL: http://bank:8081
      SFTP_OUT_DIR: /sftp/out
      SFTP_STAGING_DIR: /sftp/staging
      SFTP_OUTBOUND_DIR: /sftp/outbound
      SETTLEMENT_STATE_FILE: /data/settlements.json
      CUTOFF_TIME: "00:00"
      WORLDLINE_SETTLEMENT_IDENTIFIER: "Worldline_Settlement"
      # Settlement's payout call goes to B4B, not Banking Circle directly --
      # Banking Circle has no payment-creation endpoint in real life (see
      # docs/ARCHITECTURE-vendor-corrections.md Addendum section A). B4B's
      # keypair (generated by the b4b service, see below) is shared here
      # read-only so settlement can sign the RS512 JWT B4B requires.
      B4B_URL: http://b4b:8086
      B4B_JWT_PRIVATE_KEY_PATH: /b4b-keys/private.pem
      B4B_JWT_KEY_ID: "b4b-mock-1"
      B4B_CALLBACK_URL: http://settlement:8083/internal/b4b-webhook
      # Merchant-verification gate before every B4B payout (docs/
      # ARCHITECTURE-phase3-corrections.md section 5) -- a sample/stub
      # service, always-positive by default (see the verify service below).
      VERIFY_URL: http://verify:8088
      VERIFY_INTERNAL_API_KEY: sim-verify-key-dev-only
      # Banking Circle's plain INTERNAL_LISTEN, for the safeguarding-account
      # balance check only -- settlement never holds Banking Circle's
      # mTLS+bearer credentials, matching real settle-processing (docs
      # section 1 and 5). Not the mTLS-credentialed :8085 surface, and
      # deliberately NOT named BANKING_CIRCLE_URL like the harness's own
      # (different) env var of that name (mTLS :8085) -- same literal
      # name, different meaning, different process would be confusing.
      BC_INTERNAL_URL: http://banking-circle:8095
      BC_SAFEGUARDING_ACCOUNT_ID_EUR: 00000000-0000-4000-8000-000000000978
      BC_SAFEGUARDING_ACCOUNT_ID_GBP: 00000000-0000-4000-8000-000000000826
      # Take delivery of Worldline's settlement files over the real
      # SFTP+PGP channel. This is the whole configuration surface for that
      # integration: point WORLDLINE_SFTP_HOST at real Worldline, supply
      # the real credentials and PGP key, and the same code runs unchanged.
      # Nothing else in this service can see the acquirer's files.
      WORLDLINE_SFTP_HOST: worldline
      WORLDLINE_SFTP_PORT: "2222"
      WORLDLINE_SFTP_USER: infinitepay
      WORLDLINE_SFTP_PASSWORD: sim-sftp-dev-only
      # Set WORLDLINE_SFTP_PRIVATE_KEY_PATH instead against a real,
      # key-authenticated Worldline account; the client offers a key first
      # and falls back to the password, so one configuration works on both.
      WORLDLINE_SFTP_KNOWN_HOST_PATH: /wlsftp-keys/host_key.pub
      WORLDLINE_PGP_PRIVATE_KEY_PATH: /wlsftp-keys/worldline_private.asc
      WORLDLINE_PGP_PUBLIC_KEY_PATH: /wlsftp-keys/worldline_public.asc
      WORLDLINE_PULL_INTERVAL: "10s"
      WORLDLINE_ARCHIVE_DIR: /data/worldline
    volumes:
      - ./sftp/out:/sftp/out:rw
      - ./sftp/staging:/sftp/staging:rw
      # Shared with worldline: settlement writes the same report a
      # second time here in the gateway's own directory shape, so the
      # gateway can serve/archive it without the two services talking to
      # each other over the network — a plain shared bind mount, same
      # pattern this compose file already uses for ./certs.
      - ./sftp/outbound:/sftp/outbound:rw
      - settlement-data:/data:rw
      - ./b4b-keys:/b4b-keys:ro
      # Read-only: the platform holds the PGP private key that decrypts
      # what the acquirer sends, and pins the acquirer's SSH host key. It
      # gets no write access to anything of Worldline's.
      - ./wlsftp-keys:/wlsftp-keys:ro
    depends_on:
      bank:
        condition: service_started
      worldline:
        condition: service_started
      b4b:
        condition: service_started
      verify:
        condition: service_started
      banking-circle:
        condition: service_started

  # Worldline: the acquirer. It holds the card transactions it acquired per
  # submerchant (MID), cuts the daily settlement file from them in two
  # slots, publishes them PGP-encrypted on a real SSH/SFTP server, and
  # credits the platform's safeguarding account with the matching lump sum.
  # Also serves the SFT file-exchange channel over HTTP on :8084.
  worldline:
    build:
      context: .
      dockerfile: docker/Dockerfile.worldline
    ports:
      - "8084:8084"
      # Real Worldline SFTP+PGP channel (docs/ARCHITECTURE-vendor-
      # corrections.md section 2) -- a genuine SSH/SFTP listener, not HTTP.
      - "2222:2222"
    environment:
      LISTEN: ":8084"
      SFTP_BASE_DIR: /sftp
      MERCHANT_ID: "GB00SIM0000000000003"
      WORLDLINE_SFTP_PORT: "2222"
      WORLDLINE_SFTP_HOST_KEY_PATH: /wlsftp-keys/host_key
      # The host key's public half is written here at startup so the
      # platform side can pin it (WORLDLINE_SFTP_KNOWN_HOST_PATH on
      # settlement) rather than trusting whatever answers on :2222.
      WORLDLINE_SFTP_HOST_KEY_PUB_PATH: /wlsftp-keys/host_key.pub
      WORLDLINE_PGP_PUBLIC_KEY_PATH: /wlsftp-keys/worldline_public.asc
      WORLDLINE_PGP_PRIVATE_KEY_PATH: /wlsftp-keys/worldline_private.asc
      # A real, deliberate lab credential rather than the accept-any-auth
      # fallback (which only kicks in when this is unset) -- fake-obvious,
      # same spirit as sim-hmac-dev-only. Public-key auth runs alongside it
      # whenever WORLDLINE_SFTP_AUTHORIZED_KEY is set; setting a password
      # no longer switches key auth off, so the lab can exercise the
      # method a real Worldline account actually uses.
      WORLDLINE_SFTP_PASSWORD: sim-sftp-dev-only
      # INFINITE_PGP_PUBLIC_KEY_PATH intentionally unset: this lab has no
      # separate platform keypair, so mock-Worldline self-encrypts to its
      # own public key (docs Addendum section E) -- settlement decrypts
      # with the same generated private key via the shared volume below.
      #
      # The daily settlement cycle. The morning file lands somewhere in the
      # 08:00-10:00 window (jittered deterministically across
      # WORLDLINE_MORNING_FILE_WINDOW, so a consumer cannot depend on an
      # exact second while a test still repeats); the afternoon file is the
      # confirmation. WORLDLINE_SETTLEMENT_DELAY is Worldline's T+1: a
      # cycle run today settles yesterday's transactions.
      WORLDLINE_SETTLEMENT_IDENTIFIER: "Worldline_Settlement"
      # TO_ACCOUNT in the file's Settlement section: the platform's
      # safeguarding account, which is what the lump sum is paid into. Not
      # a merchant -- one file covers every submerchant that traded, and
      # the platform works out each outlet's share from the rows.
      WORLDLINE_SETTLEMENT_ACCOUNT: "GB00SIM0000000000001"
      WORLDLINE_MORNING_FILE_AT: "08:00"
      WORLDLINE_MORNING_FILE_WINDOW: "2h"
      WORLDLINE_AFTERNOON_FILE_AT: "15:30"
      WORLDLINE_SETTLEMENT_DELAY: "24h"
      # "generate" builds the file from the transactions this service
      # holds. Switch to "fixture" and drop a real example settlement file
      # into ./worldline/fixtures to have it served byte-for-byte instead
      # -- which is how you test a parser against the genuine article.
      WORLDLINE_FILE_SOURCE: generate
      WORLDLINE_FIXTURE_DIR: /wlsftp-fixtures
      # Worldline does not call Banking Circle in real life: the lump sum
      # simply arrives in the platform's safeguarding account, wired
      # bank-to-bank. This lab has no interbank rail, so the acquirer
      # credits the account directly -- it is the arrival of the money
      # being simulated, not the mechanism that delivers it.
      BC_INTERNAL_URL: http://banking-circle:8095
      BC_SAFEGUARDING_ACCOUNT_ID_EUR: 00000000-0000-4000-8000-000000000978
      BC_SAFEGUARDING_ACCOUNT_ID_GBP: 00000000-0000-4000-8000-000000000826
    volumes:
      - ./sftp/inbound:/sftp/inbound:rw
      - ./sftp/outbound:/sftp/outbound:rw
      - ./sftp/config:/sftp/config:rw
      - ./sftp/archive:/sftp/archive:rw
      - ./wlsftp-keys:/wlsftp-keys:rw
      - ./worldline/fixtures:/wlsftp-fixtures:ro
    depends_on:
      banking-circle:
        condition: service_started

  banking-circle:
    build:
      context: .
      dockerfile: docker/Dockerfile.banking-circle
    ports:
      - "8085:8085"
      # Plain-HTTP, unauthenticated bridge listener -- lab-only, same-
      # network trust, only the b4b service calls this (docs Addendum
      # section C: mTLS applies per-listener, not per-route, so the real-
      # shaped credentialed API and this bridge cannot share one).
      - "8095:8095"
    environment:
      # A payout that leaves the safeguarding account arrives at the
      # beneficiary's own bank. Without this the money would vanish at
      # the edge of Banking Circle's books, which is not what happens.
      BANK_CREDIT_URL: http://bank:8081/internal/credit
      LISTEN: ":8085"
      INTERNAL_LISTEN: ":8095"
      PROCESSING_DELAY: 2s
      # receiver only understands the HMAC scheme (notifier's, above) --
      # it cannot verify or store this different, AES-256-GCM wire format,
      # so this points at receiver's raw, unvalidated capture endpoint
      # instead (docs/ARCHITECTURE-phase3-corrections.md section 6)
      # confirming delivery actually reached its destination.
      WEBHOOK_URL: https://receiver:8443/raw-events
      # host.containers.internal lets a client running on the host (rather than
      # in this compose network) register its own endpoint -- Podman and Docker
      # both resolve it. "localhost" above is this container, not the host.
      WEBHOOK_ALLOWLIST: bank,bank:8081,receiver,receiver:8443,localhost,127.0.0.1,host.containers.internal
      # Real Banking Circle encrypts webhook notifications with AES-256-GCM
      # using the raw UTF-8 bytes of this 32-character key (NOT base64-
      # decoded -- see internal/bankingcircle's encryptNotification doc
      # comment). This replaces the old HMAC_SECRET; Banking Circle's real
      # webhook scheme was never HMAC.
      BC_NOTIFICATION_KEY: sim-bc-notification-key-32-chars
      CA_FILE: /certs/ca.pem
      TLS_CERT: /certs/banking-circle.pem
      TLS_KEY: /certs/banking-circle-key.pem
      # mTLS is optional. Real integrations vary, and the harness presents
      # a client certificate, so "require" is the default here. Set "off"
      # to match a deployment that does not use client certificates, or
      # "optional" to accept both. Bearer auth applies in every mode: this
      # never makes the API unauthenticated.
      BC_MTLS: require
      # Notification delivery -- the retry schedule, batch flush timing and
      # the time scale that makes a two-day schedule watchable -- comes
      # from a file, because the interesting part of it is a table. The
      # shipped file compresses time by 3600x; set time_scale to 1 there
      # for real timing. See docs/ARCHITECTURE-banking-circle-webhooks.md.
      BC_DELIVERY_CONFIG: /config/banking-circle.json
      # The one knob outside the file. The real schedule reaches
      # deactivation 48 hours after the first failure; dividing every delay
      # by 86400 plays the whole eleven-step story out in about four
      # seconds, with the step count and shape -- which is what a client is
      # actually tested against -- unchanged. Set it to 1 for real timing.
      BC_TIME_SCALE: "86400"
      # Batch size is a per-subscription setting a client chooses. The
      # seeded convenience subscription uses the documented minimum so the
      # harness sees batching happen rather than one-notification messages.
      BC_SEED_BATCH_SIZE: "5"
      BC_SEED_SUBSCRIPTION_EMAIL: alerts@fintechlab-simple.local
    volumes:
      - ./certs:/certs:ro
      - ./config:/config:ro
    depends_on:
      receiver:
        condition: service_started

  b4b:
    build:
      context: .
      dockerfile: docker/Dockerfile.b4b
    ports:
      - "8086:8086"
    environment:
      LISTEN: ":8086"
      B4B_JWT_KEYS_DIR: /b4b-keys
      # Set this instead to verify inbound tokens against a *client's* own
      # public key, which is how a real vendor holds the credential. Left
      # empty, b4b generates the keypair itself and settlement signs with
      # the private half -- convenient for this lab, inverted from reality.
      # B4B_JWT_PUBLIC_KEY_PATH: /b4b-keys/client-public.pem
      B4B_JWT_KEY_ID: "b4b-mock-1"
      B4B_PROCESSING_DELAY: 300ms
      # Everything b4b has been told: companies, addresses, people,
      # extended profiles, uploads, vIBANs, beneficiaries and payments.
      # Boarding is a chain a client walks once, so forgetting it on
      # restart would mean re-boarding before every run.
      B4B_STATE_PATH: /b4b-data/state.json
      # The client-account callback endpoint: where a screening callback
      # goes when the record it is about carries no callback_url of its
      # own. Real Oversight has exactly this and no per-record field, so a
      # client under test needs it set -- point it at your own receiver.
      # B4B_CALLBACK_URL: http://host.containers.internal:3000/api/v1/b4b/callback
      # Refuse a payment whose company_id is not the one its beneficiary
      # was registered under. Off, because whether the real API enforces it
      # is unconfirmed -- turn it on to find out what your client does if
      # it does. See internal/b4b/beneficiary.go CheckCompany.
      B4B_ENFORCE_BENEFICIARY_COMPANY: "false"
      # The harness registers beneficiaries with its own callback_url;
      # settlement's own host is the only one it uses, and localhost covers
      # a local (non-compose) harness run. host.containers.internal is what
      # a client running on the host (not in this compose network) needs.
      WEBHOOK_ALLOWLIST: settlement,settlement:8083,localhost,127.0.0.1,host.containers.internal
      # Bridge target once a payment reaches B4BTMApproved -- Banking
      # Circle's plain-HTTP internal listener (INTERNAL_LISTEN above), not
      # its mTLS-credentialed one; this call carries no credentials
      # (lab-only, same-network trust, see docs Addendum section C).
      BANKING_CIRCLE_URL: http://banking-circle:8095
      RETRY_BACKOFF: 1s,2s,4s
      MAX_ATTEMPTS: "4"
    volumes:
      - ./b4b-keys:/b4b-keys:rw
      - ./b4b-data:/b4b-data:rw
    depends_on:
      banking-circle:
        condition: service_started

  # ACI: the online card-payment gateway (docs/ARCHITECTURE-phase3-
  # corrections.md section 2). Independent of every other service here --
  # it is the *sender* of a webhook a real buddy settle-aci-webhook (or
  # its gateway proxy) receives, not something this lab's own services
  # call into. ACI_WEBHOOK_TARGET_URL here points at receiver's raw
  # capture sink (docs section 6) so the harness/demo observes a real,
  # fast delivery within this lab's own network by default -- cmd/aci's
  # own code default is buddy's real local-dev address
  # (http://localhost:3013/api/v1/webhook); point a real buddy
  # settle-aci-webhook there instead when that's what you want to feed.
  aci:
    build:
      context: .
      dockerfile: docker/Dockerfile.aci
    ports:
      - "8087:8087"
    environment:
      LISTEN: ":8087"
      # 64 hex chars -> 32 raw bytes. Obviously fake, not ACI's own
      # published sample key (see internal/aci's known-answer test).
      ACI_WEBHOOK_SECRET: aaaa1111bbbb2222cccc3333dddd4444eeee5555ffff6666aaaa7777bbbb8888
      ACI_WEBHOOK_TARGET_URL: https://receiver:8443/raw-events
      ACI_WEBHOOK_BODY_MODE: raw
      WEBHOOK_ALLOWLIST: receiver,receiver:8443,localhost,127.0.0.1
      CA_FILE: /certs/ca.pem
      RETRY_BACKOFF: 1s,2s,4s
      MAX_ATTEMPTS: "4"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      receiver:
        condition: service_started

  # Merchant verification (docs/ARCHITECTURE-phase3-corrections.md section
  # 3) -- a sample/stub standing in for buddy's real verification-service:
  # always approves unless VERIFY_FORCE_DECLINE_IDS lists the derived id.
  verify:
    build:
      context: .
      dockerfile: docker/Dockerfile.verify
    ports:
      - "8088:8088"
    environment:
      LISTEN: ":8088"
      VERIFICATION_INTERNAL_API_KEY: sim-verify-key-dev-only
      VERIFY_PROCESSING_DELAY: 100ms

  # Console: the lab's control panel. A client of everything else and
  # nothing more -- every button it offers is one call to a service's own
  # public API, so nothing in this lab can only be reached through a UI and
  # the console being down is never why a scenario cannot run.
  # The four external checks the platform runs before it will move a
  # merchant's money. One process, four path prefixes — nothing is shared
  # between them except the address. Every check passes; POST /sim/outcome
  # to make one fail.
  verification:
    build:
      context: .
      dockerfile: docker/Dockerfile.verification
    ports:
      - "8089:8089"
    environment:
      LISTEN: ":8089"


  console:
    build:
      context: .
      dockerfile: docker/Dockerfile.console
    ports:
      - "8090:8090"
    environment:
      LISTEN: ":8090"
      # Reached over the compose network by service name. The catalogue's
      # own port list is what builds the "open in a browser" links, which
      # have to point at the published host ports instead -- CONSOLE_BROWSE_HOST
      # names the host those are published on.
      CONSOLE_URL_WORLDLINE: http://worldline:8084
      CONSOLE_URL_B4B: http://b4b:8086
      CONSOLE_URL_BANKING_CIRCLE: https://banking-circle:8085
      CONSOLE_URL_ACI: http://aci:8087
      CONSOLE_URL_VERIFY: http://verify:8088
      CONSOLE_URL_VERIFICATION: http://verification:8089
      CONSOLE_URL_SETTLEMENT: http://settlement:8083
      CONSOLE_URL_RECEIVER: https://receiver:8443
      CONSOLE_URL_PAYMENT_API: http://payment-api:8080
      CONSOLE_URL_BANK: http://bank:8081
      CONSOLE_URL_NOTIFIER: http://notifier:8082
      CONSOLE_BROWSE_HOST: 127.0.0.1
      CONSOLE_PROBE_INTERVAL: 5s
      # The platform under test, when there is one: infinite-local-runner's
      # control API. It runs on the host, not in this network, so it is
      # named the way a container reaches the host. Set
      # CONSOLE_LOCAL_RUNNER=off to drop the card entirely — the lab stands
      # alone and a permanently red row for something nobody started is
      # worse than no row.
      CONSOLE_URL_LOCAL_RUNNER: http://host.containers.internal:3109
      # The Pods view. The recipes are read from disk for the declared
      # schematic, by compose service name rather than the loopback address
      # the recipe's own `listen:` implies.
      #
      # These are set whether or not the `pods` profile is up. A pod that
      # is not running is not an error: its recipe still renders and the
      # card says `recipe` rather than `running`.
      # Plain :9185 — console fetches /pod over HTTP without client certs.
      # Connect API + mTLS stays on :9085 (curl with client cert).
      CONSOLE_STATE_FILE: /console-data/registry.json
      CONSOLE_BC_DELIVERY_CONFIG: /config/banking-circle.json
      # Banking Circle's API requires mTLS by default (BC_MTLS above), so
      # the console presents the same client certificate the harness does.
      # Basic credentials are not checked by the simulator, but the
      # exchange is: the console gets a real bearer token like any client.
      CA_FILE: /certs/ca.pem
      CLIENT_CERT: /certs/client.pem
      CLIENT_KEY: /certs/client-key.pem
      BC_USER: console
      BC_PASSWORD: sim-bc-dev-only
      # Registering a merchant outlet as a B4B beneficiary needs the RS512
      # signing key b4b generates -- read-only, same shared volume
      # settlement already uses for exactly this.
      B4B_JWT_PRIVATE_KEY_PATH: /b4b-keys/private.pem
      B4B_JWT_KEY_ID: "b4b-mock-1"
    volumes:
      - ./certs:/certs:ro
      - ./config:/config:ro
      - ./b4b-keys:/b4b-keys:ro
      - ./console-data:/console-data:rw
      # Read-only: the console renders recipes, it never edits them. A
      # bind mount rather than a copy so an edited recipe shows up on the
      # next poll without a rebuild -- which is the point of recipes being
      # data. Relative ./recipes is more reliable than ${PWD}/recipes under
      # podman-compose (broken ${PWD} left /recipes absent). Dockerfile.console
      # also bakes /recipes as a fallback when the mount fails.
    depends_on:
      worldline:
        condition: service_started
      b4b:
        condition: service_started
      banking-circle:
        condition: service_started
      settlement:
        condition: service_started

  # --- pods -----------------------------------------------------------
  #
  # The kernel/pod architecture (docs/kernels.md). Vendor pods + platform
  # ledger-recon sit behind the `pods` profile, so `make up` starts exactly
  # what it started before and `docker compose --profile pods up` adds them.
  # They run alongside the standalone services rather than replacing any.
  #
  # One image, many containers: which pod a container becomes is POD_RECIPE,
  # decided here rather than at build time. That is the architecture's whole
  # claim made operational — a new vendor is a directory, not a Dockerfile.





volumes:
  # Named (not a host bind mount): this is internal state, not something a
  # human needs to browse, so it can be initialized from the image's own
  # /data ownership (see docker/Dockerfile.settlement) instead of inheriting
  # whatever UID happens to own a host-created directory.
  settlement-data:
