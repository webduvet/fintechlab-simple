<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fintech sim lab v1 — console</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a855f7'/><path d='M9 21V11h6.5a3.5 3.5 0 0 1 0 7H12v3z' fill='white'/></svg>">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <!-- The mark is drawn, not a glyph: a font's diamond sits on its own
           baseline and never quite centres in the tile. It also folds and
           unfolds the sidebar. -->
      <button class="brand-mark" id="brand-mark" type="button" title="Collapse the sidebar" aria-label="Collapse the sidebar">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <path d="M16 6 26 16 16 26 6 16Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
          <path d="M16 11.5 20.5 16 16 20.5 11.5 16Z" fill="#fff"/>
        </svg>
      </button>
      <div class="brand-text">
        <strong>fintech sim lab v1</strong>
        <span>control panel</span>
      </div>
      <button class="rail-toggle" id="rail-toggle" type="button" title="Collapse the sidebar" aria-label="Collapse the sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M3 5.5h10M3 10.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="dashboard" title="Dashboard">
        <span class="nav-icon">◎</span><span class="nav-label">Dashboard</span>
        <span class="nav-badge" id="badge-dashboard"></span>
      </button>
      <button class="nav-item" data-view="vendors" title="Vendors">
        <span class="nav-icon">▤</span><span class="nav-label">Vendors</span>
        <span class="nav-badge" id="badge-vendors"></span>
      </button>
      <button class="nav-item" data-view="platform" title="Platform">
        <span class="nav-icon">▥</span><span class="nav-label">Platform</span>
        <span class="nav-badge" id="badge-platform"></span>
      </button>
      <button class="nav-item" data-view="verification" title="Verification">
        <span class="nav-icon">◈</span><span class="nav-label">Verification</span>
        <span class="nav-badge" id="badge-verification"></span>
      </button>
      <button class="nav-item" data-view="banks" title="Banks">
        <span class="nav-icon">▦</span><span class="nav-label">Banks</span>
        <span class="nav-badge" id="badge-banks"></span>
      </button>
      <button class="nav-item" data-view="merchants" title="Merchants">
        <span class="nav-icon">◍</span><span class="nav-label">Merchants</span>
        <span class="nav-badge" id="badge-merchants"></span>
      </button>
      <button class="nav-item" data-view="docs" title="Docs">
        <span class="nav-icon">¶</span><span class="nav-label">Docs</span>
      </button>
      <button class="nav-item" data-view="config" title="Configuration">
        <span class="nav-icon">⚙</span><span class="nav-label">Configuration</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="legend">
        <span><i class="dot up"></i>up</span>
        <span><i class="dot down"></i>down</span>
        <span><i class="dot unknown"></i>unknown</span>
      </div>
      <div class="sidebar-buttons">
        <button class="ghost small" id="theme-toggle" title="Switch theme">◐ <span class="nav-label">theme</span></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="view-title">Dashboard</h1>
        <p id="view-sub" class="sub"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <div class="main-body">
      <div class="content" id="content"><div class="empty">Loading…</div></div>
      <aside class="drawer" id="drawer" aria-label="Hop traffic" hidden></aside>
    </div>
  </main>
</div>

<div class="toasts" id="toasts"></div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
